services:
  postgres-db:
    image: postgres:18-alpine
    container_name: apollonia-dental-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: apollonia_user
      POSTGRES_PASSWORD: apollonia_password
      POSTGRES_DB: apollonia_db

    ports:
      - "5432:5432"

    volumes:
      - apollonia_postgres_data:/var/lib/postgresql/data

    shm_size: 256mb

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollonia_user -d apollonia_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - apollonia-network

  backend:
    build:
      context: ../../apps/backend/nodejs
      dockerfile: Dockerfile

    container_name: apollonia-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://apollonia_user:apollonia_password@postgres-db:5432/apollonia_db

    depends_on:
      postgres-db:
        condition: service_healthy

    networks:
      - apollonia-network

  frontend:
    build:
      context: ../../apps/frontend/angular-app
      dockerfile: Dockerfile

    container_name: apollonia-frontend

    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      backend:
        condition: service_started

    networks:
      - apollonia-network

volumes:
  apollonia_postgres_data:

networks:
  apollonia-network:
    driver: bridge
